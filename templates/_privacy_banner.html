{% if not privacy_state.chosen %}
<aside class="privacy-choice" id="privacy-choice" aria-label="Preferencias de privacidad">
  <div><strong>Tu privacidad en Sucr&eacute;e</strong><span>Marketing y metricas opcionales estan desactivados hasta que elijas. La compra y agenda funcionan igual.</span></div>
  <div class="privacy-choice-actions"><a href="/privacidad/preferencias">Configurar</a><button type="button" id="privacy-reject">Rechazar opcionales</button><a href="/privacidad">Mas informacion</a></div>
</aside>
<style>.privacy-choice{position:fixed;z-index:10050;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));margin:auto;max-width:850px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px;border:1px solid #ead6bd;border-radius:16px;background:#fffdf9;color:#382216;box-shadow:0 12px 42px #39221130;font:14px/1.4 Arial,sans-serif}.privacy-choice>div:first-child{display:grid;gap:3px}.privacy-choice span{color:#6d5a4c}.privacy-choice-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.privacy-choice-actions a{color:#8a4900;font-weight:700;text-decoration:underline}.privacy-choice button{border:0;border-radius:9px;padding:10px 12px;background:#ef7d00;color:white;font-weight:700;white-space:nowrap}@media(max-width:620px){.privacy-choice{display:grid;gap:10px;padding:12px}.privacy-choice-actions{justify-content:space-between}.privacy-choice-actions button{order:-1;flex:1}}</style>
<script>(()=>{const b=document.getElementById('privacy-reject');if(!b)return;b.addEventListener('click',async()=>{b.disabled=true;try{const r=await fetch('/api/privacidad/preferencias',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':'{{ privacy_csrf_token }}'},body:JSON.stringify({marketing_email:false,marketing_whatsapp:false,analytics_internal:false,source:'aviso_global'})});if(!r.ok)throw new Error();document.getElementById('privacy-choice')?.remove()}catch(_){b.disabled=false;b.textContent='Intenta nuevamente'}})})();</script>
{% endif %}
