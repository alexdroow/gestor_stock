    function nearBottom(){return messages.scrollHeight-messages.scrollTop-messages.clientHeight<160}function scrollIfNeeded(force=false){if(force||nearBottom())messages.scrollTop=messages.scrollHeight}function normalizeActionText(t){return String(t||'').replace(/^[\-•]\s*/,'').replace(/^["']|["']$/g,'').replace(/\.$/,'').trim()}
    function buildAutoSuggestions(text){const raw=text||'',out=[],seen=new Set(),add=l=>{const c=normalizeActionText(l);if(!c||c.length>90||seen.has(c.toLowerCase()))return;seen.add(c.toLowerCase());out.push(c)};const lines=raw.split(/\r?\n/);let cap=false;for(const line of lines){const clean=line.trim(),lower=clean.toLowerCase();if(/escribe.*por ejemplo|puedes escribir|opciones:|tipos disponibles:/.test(lower)){cap=true;continue}if(!clean){cap=false;continue}const b=clean.match(/^[\-•]\s+(.+)/);if(b&&cap)add(b[1])}if(/correo del cliente|por favor escribe el correo/i.test(raw))add('Ingresar correo del cliente');if(/dime cual prefieres|horas disponibles|horas tentativas/i.test(raw))lines.forEach(l=>{const h=l.trim().match(/^[\-•]?\s*(\d{1,2}:\d{2})$/);if(h)add(h[1])});if(/catalogo|precios/i.test(raw))add('Ver catalogo y precios');if(/agendar torta/i.test(raw))add('Agendar torta');if(/codigo completo del pedido|seguimiento/i.test(raw))add('Consultar estado de pedido');return out.slice(0,6)}

    function messageTime(){return new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'})}

    function actionIcon(label){const l=String(label||'').toLowerCase();if(l.includes('fecha')||l.includes('hora')||/^\d{1,2}:\d{2}$/.test(l))return'i-calendar';if(l.includes('catalogo')||l.includes('torta')||l.includes('relleno'))return'i-cake';if(l.includes('direccion')||l.includes('despacho'))return'i-truck';if(l.includes('correo')||l.includes('nombre')||l.includes('telefono'))return'i-user';if(l.includes('estado')||l.includes('seguimiento'))return'i-clock';return'i-arrow'}function addQuickActions(actions){const box=document.createElement('div');box.className='quick-actions';actions.slice(0,7).forEach(label=>{const btn=document.createElement('button');btn.type='button';btn.className='quick-action';btn.innerHTML=icon(actionIcon(label))+`<span>${escapeHtml(label)}</span>`;btn.addEventListener('click',()=>{const isTeam=String(label||'').toLowerCase().includes('hablar con el equipo');if(isTeam){window.open(document.getElementById('team-link').href,'_blank','noopener,noreferrer');return}ask(label)});box.appendChild(btn)});messages.appendChild(box)}
    function showTyping(){hideTyping();typingWrap=document.createElement('div');typingWrap.className='msg-wrap bot';const av=document.createElement('div');av.className='avatar-small';av.textContent='S';const node=document.createElement('div');node.className='msg bot typing';node.setAttribute('aria-label','El asistente esta escribiendo');node.innerHTML='<span></span><span></span><span></span>';typingWrap.appendChild(av);typingWrap.appendChild(node);messages.appendChild(typingWrap);scrollIfNeeded(true)}function hideTyping(){if(typingWrap?.parentNode)typingWrap.parentNode.removeChild(typingWrap);typingWrap=null}
    function cleanReplyForCard(reply,hasQuote){let text=String(reply||'').trim();if(!hasQuote)return text;text=text.replace(/Ya tengo esta cotizacion preliminar:\s*[\s\S]*?(?:Hora:\s*[^\n]+\n?)/i,'').trim();text=text.replace(/PDF de cotizacion:\s*\n?https?:\/\/\S+/i,'').trim();return text||'Revisa los detalles antes de enviar tu solicitud.'}
    function productImageFromQuote(q){for(const row of [q?.categoria,q?.size,q?.producto].filter(Boolean)){const url=row.foto_url||row.imagen_url||row.image_url||row.foto||row.imagen;if(url)return String(url)}return''}
    function quoteDetails(){const q=lastQuote||{},size=q.size||{},cat=q.categoria||{},sab=Array.isArray(q.sabores)?q.sabores.map(x=>x?.nombre).filter(Boolean):[],ext=Array.isArray(q.extras)?q.extras.map(x=>`${x?.nombre||'Extra'}${Number(x?.qty||1)>1?' x'+Number(x.qty):''}`).filter(Boolean):[],top=q.topper?.nombre||(draft.topper_id?'Topper seleccionado':'Sin topper');return{title:firstText(cat.nombre,'Torta Sucrée'),size:firstText(size.nombre,''),sabores:sab,extras:ext,topper:top,total:Number(q.subtotal||0),image:productImageFromQuote(q)}}
    function contactStatus(){const m=[];if(!draft.nombre)m.push('nombre');if(!draft.telefono)m.push('teléfono');if(!draft.email)m.push('correo');if(draft.entrega_tipo==='despacho'&&!draft.direccion)m.push('dirección');return m.length?'Falta '+m.join(', '):'Datos de contacto completos'}
    function renderSummaryCard(data={}){if(!lastQuote)return;const d=quoteDetails(),code=firstText(data.codigo_pedido,draft.cotizacion_codigo,''),pdf=firstText(data.pdf_url,draft.cotizacion_pdf_url,''),sent=Boolean(data.agenda_id||pdf||draft.cotizacion_evento_id||code),modalidad=draft.entrega_tipo==='despacho'?'Despacho':'Retiro en tienda',place=draft.entrega_tipo==='despacho'?(draft.direccion||'Dirección pendiente'):'Sucrée Pastelería';const card=document.createElement('article');card.className='summary-card';card.innerHTML=`<div class="summary-head"><h2 class="summary-title">Resumen de tu solicitud</h2><span class="badge">${icon(sent?'i-check':'i-wait')}${sent?'Registrada':'Por enviar'}</span></div><div class="summary-body"><div class="product-row"><div class="product-image">${d.image?`<img src="${escapeHtml(d.image)}" alt="${escapeHtml(d.title)}">`:icon('i-cake')}</div><div class="product-info"><h3>${escapeHtml(d.title)}</h3><p>${escapeHtml(d.size||'Tamaño por confirmar')}</p><div class="kv-grid"><span>Relleno</span><strong>${escapeHtml(d.sabores.join(', ')||'Por definir')}</strong>${d.extras.length?`<span>Extra</span><strong>${escapeHtml(d.extras.join(', '))}</strong>`:''}<span>Topper</span><strong>${escapeHtml(d.topper)}</strong></div></div></div><section class="detail-section"><div class="detail-icon">${icon(draft.entrega_tipo==='despacho'?'i-truck':'i-store')}</div><div><h4>${escapeHtml(modalidad)}</h4><p>${escapeHtml(place)}</p><div class="subgrid"><span class="inline">${icon('i-calendar')} ${escapeHtml(formatDate(draft.fecha))}</span><span class="inline">${icon('i-clock')} ${escapeHtml(draft.hora_inicio||'-')}</span></div></div>${sent?'':`<button class="edit-link" type="button" data-edit="fecha">${icon('i-pencil')}Editar</button>`}</section><section class="detail-section"><div class="detail-icon">${icon('i-user')}</div><div><h4>Contacto</h4><p><strong>${escapeHtml(draft.nombre||'Nombre pendiente')}</strong></p><p>${escapeHtml(contactStatus())}</p></div>${se     function setCardProcessing(card,on){const btn=card?.querySelector('.primary-action');if(on){card.classList.add('processing');if(btn){btn.disabled=true;btn.innerHTML=`<span class="processing-spinner" aria-hidden="true"></span> Procesando solicitud...`}if(!card.querySelector('.processing-panel')){const panel=document.createElement('div');panel.className='processing-panel';panel.setAttribute('role','status');panel.setAttribute('aria-live','polite');panel.innerHTML='<span class="processing-spinner" aria-hidden="true"></span><div><strong>Estamos procesando tu solicitud</strong><span>Validando disponibilidad y generando tu PDF. Espera unos segundos, por favor.</span></div>';card.querySelector('.summary-body')?.appendChild(panel)}scrollIfNeeded(true);return}card.classList.remove('processing');card.querySelector('.processing-panel')?.remove();if(btn){btn.disabled=false;btn.innerHTML=`Enviar solicitud ${icon('i-arrow')}`}}

    async function sendRequestFromCard(card){if(submittingRequest||conversationClosed)return;submittingRequest=true;setCardProcessing(card,true);const data=await ask('confirmar reserva',{silentUser:true});if(data&&(data.agenda_id||data.pdf_url||data.codigo_pedido)){card.remove();closeConversation()}else{setCardProcessing(card,false)}submittingRequest=false}
