    <script>
        (function () {
            const details = document.getElementById('nav-group-insumos');
            if (!details) return;
            const currentPath = String(window.location.pathname || '').replace(/\/+$/, '') || '/';
            if (currentPath === '/insumos') {
                details.open = true;
            }
        })();

        (function () {
            const details = document.getElementById('nav-group-settings');
            if (!details) return;
            const currentPath = String(window.location.pathname || '').replace(/\/+$/, '') || '/';
            if (currentPath === '/settings' || currentPath === '/settings/clientes') {
                details.open = true;
            }
        })();

        (function () {
            if (window.__sucreeSidebarTuyaInit) return;
            window.__sucreeSidebarTuyaInit = true;

            const REFRESH_MS = 60 * 1000;
            const refs = {
                rowRefri: document.getElementById('st-row-refri'),
                rowVitrina: document.getElementById('st-row-vitrina'),
                labelRefri: document.getElementById('st-refri-label'),
                labelVitrina: document.getElementById('st-vitrina-label'),
                tempRefri: document.getElementById('st-refri-temp'),
                tempVitrina: document.getElementById('st-vitrina-temp'),
            };
            if (Object.values(refs).some((el) => !el)) return;

            function setLoading() {
                refs.tempRefri.textContent = '-- C';
                refs.tempVitrina.textContent = '-- C';
                refs.rowRefri.classList.remove('st-alert');
                refs.rowVitrina.classList.remove('st-alert');
            }

            function setSlot(slot, data, defaults) {
                const row = slot === 'refri' ? refs.rowRefri : refs.rowVitrina;
                const label = slot === 'refri' ? refs.labelRefri : refs.labelVitrina;
                const temp = slot === 'refri' ? refs.tempRefri : refs.tempVitrina;

                const d = data || {};
                const titulo = String(d.punto_nombre || d.device_name || defaults.title || '').trim() || defaults.title;
                label.textContent = titulo;

                const t = Number(d.temperatura);
                temp.textContent = Number.isFinite(t) ? `${t.toFixed(1)} C` : '-- C';

                const alerta = d.alerta_temp || {};
                row.classList.toggle('st-alert', !!alerta.fuera_rango);
            }

            async function loadTuyaSidebar() {
                try {
                    const r = await fetch('/api/haccp/tuya/sidebar', { cache: 'no-store' });
                    const d = await r.json();
                    if (!r.ok || !d.success) throw new Error(d.error || 'No se pudo consultar Tuya');

                    setSlot('refri', d.refrigerador, { title: 'Refrigerador' });
                    setSlot('vitrina', d.vitrina, { title: 'Vitrina' });
                } catch (err) {
                    setLoading();
                }
            }

            setLoading();
            loadTuyaSidebar();
            setInterval(loadTuyaSidebar, REFRESH_MS);
            document.addEventListener('visibilitychange', function () {
                if (document.visibilityState === 'visible') loadTuyaSidebar();
            });
            window.addEventListener('sucree-tuya-sidebar-updated', loadTuyaSidebar);
        })();

        (function () {
            if (window.__sucreePedidosGlobalInit) return;
            window.__sucreePedidosGlobalInit = true;

            const POLL_MS = 5000;
            const LAST_ID_KEY = 'sucree_pedidos_nuevos_last_id';
            let pedidosActivos = [];
            let nuevosPendientes = [];
            let chatCtx = null;
            let chatTimer = null;
            let pendingReminderTimer = null;
            let initNuevos = false;
            let lastId = Number(localStorage.getItem(LAST_ID_KEY) || 0) || 0;
            let pedidoTimerDefault = 25;

            function esc(v) {
                return String(v || '').replace(/[&<>"]/g, (ch) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[ch]));
            }
            function labelEstado(raw) {
                const est = String(raw || 'recibido').trim().toLowerCase();
                const map = { recibido:'Recibido', confirmado:'Confirmado', preparando:'En preparacion', listo:'Listo', entregado:'Entregado', cancelado:'Cancelado' };
                return map[est] || 'Recibido';
            }
            function timerLabel(raw) {
                const mins = Number(raw || 0);
                if (!mins) return '';
                return mins >= 45 ? '+30 min' : `${mins} min`;
            }
            function timerRestanteTexto(rawSeg) {
                const seg = Number(rawSeg);
                if (!Number.isFinite(seg)) return '';
                if (seg <= 0) return 'Listo muy pronto';
                const m = Math.floor(seg / 60);
                const s = Math.max(0, seg % 60);
                return `${m}m ${String(s).padStart(2, '0')}s`;
            }
            function timerHtmlPedido(p) {
                const mins = Number(p?.timer_minutos || 0);
                if (!mins) return '<div style="margin-top:5px;font-size:.8rem;color:#b91c1c;">Sin tiempo estimado.</div>';
                const rest = timerRestanteTexto(p?.timer_restante_segundos);
                const danger = mins >= 45;
                const color = danger ? '#b91c1c' : '#065f46';
                const bg = danger ? '#fef2f2' : '#ecfdf5';
                const border = danger ? '#fecaca' : '#a7f3d0';
                return `<div style="margin-top:5px;font-size:.8rem;border:1px solid ${border};background:${bg};color:${color};padding:4px 7px;border-radius:8px;font-weight:700;">Tiempo estimado: ${timerLabel(mins)}${rest ? ` · Restante: ${rest}` : ''}</div>`;
            }

            function ensureTimerPicker() {
                let ov = document.getElementById('sucree-pedidos-timer-picker');
                if (ov) return ov;
                ov = document.createElement('div');
                ov.id = 'sucree-pedidos-timer-picker';
                ov.style.cssText = 'position:fixed;inset:0;z-index:130000;background:rgba(2,6,23,.45);display:none;align-items:center;justify-content:center;padding:14px;';
                ov.innerHTML = `
                    <div style="width:min(420px,96vw);background:#fff;border:1px solid #cbd5e1;border-radius:12px;padding:12px;box-shadow:0 16px 36px rgba(2,6,23,.28);">
                        <div style="font-size:1rem;font-weight:900;color:#0f172a;">Definir tiempo estimado</div>
                        <div style="font-size:.84rem;color:#475569;margin-top:3px;">Este tiempo se sincroniza con la tienda del cliente.</div>
                        <div id="sucree-pedidos-timer-options" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px;"></div>
                        <div style="display:flex;justify-content:flex-end;margin-top:10px;">
                            <button type="button" id="sucree-pedidos-timer-cancel" style="border:1px solid #cbd5e1;background:#fff;color:#334155;padding:7px 10px;border-radius:8px;font-weight:700;cursor:pointer;">Cancelar</button>
                        </div>
                    </div>`;
                document.body.appendChild(ov);
                return ov;
            }

            async function seleccionarTimer(defaultValue) {
                const ov = ensureTimerPicker();
                const wrap = ov.querySelector('#sucree-pedidos-timer-options');
                const cancel = ov.querySelector('#sucree-pedidos-timer-cancel');
                if (!wrap || !cancel) return null;
                const opciones = [10, 15, 25, 30, 45];
                wrap.innerHTML = opciones.map((m) => {
                    const danger = m >= 45;
                    const act = Number(defaultValue || 0) === m;
                    return `<button type="button" data-min="${m}" style="border:1px solid ${danger ? '#fca5a5' : '#bfdbfe'};background:${act ? (danger ? '#fee2e2' : '#dbeafe') : (danger ? '#fff1f2' : '#eff6ff')};color:${danger ? '#b91c1c' : '#1d4ed8'};border-radius:10px;padding:10px 8px;font-weight:800;cursor:pointer;">${timerLabel(m)}</button>`;
                }).join('');
                ov.style.display = 'flex';
                return await new Promise((resolve) => {
                    const onClick = (ev) => {
                        const btn = ev.target?.closest?.('button[data-min]');
                        if (!btn) return;
                        const mins = Number(btn.getAttribute('data-min') || 0);
                        cleanup();
                        resolve(mins || null);
                    };
                    const onCancel = () => {
                        cleanup();
                        resolve(null);
                    };
                    const onBackdrop = (ev) => { if (ev.target === ov) onCancel(); };
                    const cleanup = () => {
                        ov.style.display = 'none';
                        wrap.removeEventListener('click', onClick);
                        cancel.removeEventListener('click', onCancel);
                        ov.removeEventListener('click', onBackdrop);
                    };
                    wrap.addEventListener('click', onClick);
                    cancel.addEventListener('click', onCancel);
                    ov.addEventListener('click', onBackdrop);
                });
            }
            function beep() {
                try {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    if (!AC) return;
                    const ctx = new AC();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.value = 880;
                    gain.gain.value = 0.03;
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.16);
                    setTimeout(() => { try { ctx.close(); } catch (_) {} }, 260);
                } catch (_) {}
            }

            function esPendienteConfirmacion(estadoRaw) {
                return String(estadoRaw || '').trim().toLowerCase() === 'recibido';
            }

            function setFabAttention(pendientesCount) {
                const fab = ensureFab();
                fab.classList.toggle('attention', Number(pendientesCount || 0) > 0);
            }

            function startPendingReminder(pendientesCount) {
                const hasPending = Number(pendientesCount || 0) > 0;
                if (!hasPending) {
                    if (pendingReminderTimer) {
                        clearInterval(pendingReminderTimer);
                        pendingReminderTimer = null;
                    }
                    return;
                }
                if (pendingReminderTimer) return;
                pendingReminderTimer = setInterval(() => {
                    try { beep(); } catch (_) {}
                }, 25000);
            }

            function ensureFab() {
                let fab = document.getElementById('sucree-pedidos-fab');
                if (!fab) {
                    fab = document.createElement('button');
                    fab.id = 'sucree-pedidos-fab';
                    fab.className = 'sucree-pedidos-fab';
                    fab.type = 'button';
                    fab.textContent = 'Pedidos activos (0) | Pendientes: 0';
                    fab.addEventListener('click', () => {
                        const hub = ensureHub();
                        hub.style.display = hub.style.display === 'none' ? 'block' : 'none';
                    });
                    document.body.appendChild(fab);
                }
                try {
                    fab.style.setProperty('display', 'inline-flex', 'important');
                    fab.style.setProperty('align-items', 'center');
                    fab.style.setProperty('justify-content', 'center');
                    fab.style.setProperty('z-index', '120000');
                } catch (_) {}
                return fab;
            }

            function ensureHub() {
                let hub = document.getElementById('sucree-pedidos-hub');
                if (hub) return hub;
                hub = document.createElement('div');
                hub.id = 'sucree-pedidos-hub';
                hub.className = 'sucree-pedidos-hub';
                hub.innerHTML = `
                    <div style="display:flex;align-items:center;justify-content:space-between;padding:9px 10px;border-bottom:1px solid #e2e8f0;">
                        <strong>Pedidos activos</strong>
                        <button type="button" id="sucree-pedidos-hub-close" style="border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:4px 8px;cursor:pointer;">Cerrar</button>
                    </div>
                    <div id="sucree-pedidos-hub-list" style="max-height:280px;overflow:auto;padding:10px;display:grid;gap:8px;">
                        <div style="font-size:.85rem;color:#64748b;">Cargando...</div>
                    </div>`;
                document.body.appendChild(hub);
                hub.querySelector('#sucree-pedidos-hub-close')?.addEventListener('click', () => { hub.style.display = 'none'; });
                return hub;
            }

            function ensureChat() {
                let wrap = document.getElementById('sucree-pedidos-chat');
                if (wrap) return wrap;
                wrap = document.createElement('div');
                wrap.id = 'sucree-pedidos-chat';
                wrap.className = 'sucree-pedidos-chat';
                wrap.innerHTML = `
                    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px;border-bottom:1px solid #e2e8f0;">
                        <strong>Chat pedido</strong>
                        <button type="button" id="sucree-pedidos-chat-close" style="border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:4px 8px;cursor:pointer;">Cerrar</button>
                    </div>
                    <div id="sucree-pedidos-chat-meta" style="padding:8px 10px;font-size:.82rem;color:#475569;">-</div>

                    default: return '';

            function normalizarTelefonoWhatsapp(raw) {
                const txt = String(raw || '').trim();
                if (!txt) return '';
                const dig = txt.replace(/[^\d+]/g, '');
                if (dig.startsWith('+') && dig.length >= 11) return dig;
                const only = dig.replace(/\D/g, '');
                if (!only) return '';
                if (only.startsWith('56') && only.length >= 11) return `+${only}`;
                if (only.startsWith('9') && only.length === 9) return `+56${only}`;
                if (only.startsWith('0') && only.length > 1) return `+56${only.slice(1)}`;
                if (only.length >= 8) return `+${only}`;
                return '';
            }

            function normalizarNombreWhatsapp(nombreRaw) {
                let nombre = String(nombreRaw || '').trim();
                if (!nombre) return 'cliente';
                nombre = nombre.replace(/^hola[\s,:\-]*/i, '').trim();
                return nombre || 'cliente';
            }

            function formatearResumenPedidoWhatsapp(resumenPedidoRaw) {
                const raw = String(resumenPedidoRaw || '').trim();
                if (!raw || raw === '-') return '- Sin detalle disponible';
                const partes = raw
                    .split(/\s*,\s*/)
                    .map((s) => String(s || '').trim())
                    .filter(Boolean);
                if (!partes.length) return '- Sin detalle disponible';
                return partes.map((item, i) => `${i + 1}. ${item}`).join('\n');
            }

            function mensajeWhatsappPedido(pedidoId, nombreRaw, timerTxt, resumenPedido, totalTxt) {
                const nombre = normalizarNombreWhatsapp(nombreRaw);
                const tiempo = String(timerTxt || '').trim() || 'sin tiempo definido';
                const resumenLista = formatearResumenPedidoWhatsapp(resumenPedido);
                const total = String(totalTxt || '').trim() || '-';
                return `Hola ${nombre}, su pedido #${Number(pedidoId || 0)}. a sido confirmado y lo estamos preperando , tiene un tiempo aproximado de ${tiempo}, mientras el pedido es preparado te dejamos los datos de transferencia.\n\n*Resumen del pedido:*\n${resumenLista}\n\n*TOTAL: ${total}*\n\n💳 Datos de Transferencia 💳\n\n⚠️ NUEVOS DATOS DE TRANSFERENCIA ⚠️\n(Si tienes registrada la cuenta "Banco Santander" debes añadir la nueva cuenta.)\n\nALEXIS JAVIER GUTIERREZ SALGADO\n18.121.947-5\nBci / Banco Crédito e Inversiones\nCuenta Vista\n777018121947\npasteleria.sucree@outlook.com\n\nTe avisaremos cuando tu pedido se encuentre listo para ser retirado/despachado\n\nMuchas gracias por preferir Pasteleria Sucrée`;
            }

                const telefonoRaw = decodeURIComponent(String(telEnc || ''));
                const nombreRaw = decodeURIComponent(String(nomEnc || ''));
                const timerTxt = decodeURIComponent(String(timerEnc || ''));
                const resumenPedido = decodeURIComponent(String(resumenEnc || ''));

                    if (!res.ok || !data?.success) return;
                    const pedidos = Array.isArray(data.pedidos) ? data.pedidos : [];
                    const maxId = Number(data.max_id || 0) || 0;
                    if (!initNuevos) {
                        initNuevos = true;
                        lastId = Math.max(lastId, maxId);
                        localStorage.setItem(LAST_ID_KEY, String(lastId));
                        return;
                    }
                    if (pedidos.length) {
                        nuevosPendientes = [...pedidos, ...nuevosPendientes].slice(0, 30);
                        renderAlert();
                        beep();
                        setTimeout(beep, 300);
                    }
                    lastId = Math.max(lastId, maxId);
                    localStorage.setItem(LAST_ID_KEY, String(lastId));
                } catch (_) {}
            }

            // Mantener UI visible aunque el endpoint falle temporalmente.
            const __fabInit = ensureFab();
            if (__fabInit) {
                try { __fabInit.style.setProperty('display', 'inline-flex', 'important'); } catch (_) {}
            }
            ensureHub();
            pollActivos();
            pollNuevos();
            setInterval(pollActivos, POLL_MS);
            setInterval(pollNuevos, POLL_MS);
            setInterval(() => {
                try {
                    const f = ensureFab();
                    if (f) f.style.setProperty('display', 'inline-flex', 'important');
                } catch (_) {}
            }, 1200);
        })();
    </script>
</aside>
